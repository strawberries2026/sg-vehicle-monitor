name: Update LTA Traffic Data
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: lta-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LTA traffic snapshots
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: python3 collect_traffic.py
      - name: Commit public snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh LTA traffic snapshots"
            git push
          fi
