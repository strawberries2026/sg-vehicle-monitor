name: Update LTA Traffic Data
on:
  workflow_dispatch:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
concurrency:
  group: lta-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch LTA traffic snapshots
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: python3 collect_traffic.py
      - name: Verify collected snapshot timestamps
        run: |
          python3 - <<'PY'
          import datetime, json, pathlib, os
          now = datetime.datetime.now(datetime.timezone.utc)
          summary = ['### LTA traffic snapshot verification', '']
          for name in ('incidents', 'speed-bands'):
              payload = json.loads(pathlib.Path('data', name + '.json').read_text())
              timestamp = datetime.datetime.fromisoformat(payload['updated_at'].replace('Z', '+00:00'))
              age = (now - timestamp).total_seconds()
              if timestamp.tzinfo is None or age < -60 or age > 300:
                  raise SystemExit(f'{name}: invalid or stale collection timestamp ({age:.0f}s)')
              items = payload.get('items')
              if not isinstance(items, list):
                  raise SystemExit(f'{name}: items is not a list')
              summary.append(f'- {name}: {len(items)} records, collected {timestamp.isoformat()}, age {age:.0f}s')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('\n'.join(summary) + '\n')
          PY
      - name: Commit public snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh LTA traffic snapshots"
            git push
          fi
