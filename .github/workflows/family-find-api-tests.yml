name: Family Find API security checks
on:
  push:
    branches:
      - feature/family-find-secure-api
    paths:
      - 'family-find-worker/**'
      - '.github/workflows/family-find-api-tests.yml'
  pull_request:
    paths:
      - 'family-find-worker/**'
      - '.github/workflows/family-find-api-tests.yml'
permissions:
  contents: read
jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in family-find-worker/*.mjs; do node --check "$file"; done
      - name: Run API security smoke tests
        run: node --test family-find-worker/*.test.mjs
      - name: Run isolated D1 integration tests
        working-directory: family-find-worker
        run: |
          npm ci --ignore-scripts
          npm run test:d1
      - name: Bundle complete staging Worker without deploying
        run: |
          npx --yes esbuild@0.25.12 family-find-worker/worker.mjs --bundle --format=esm --platform=browser --target=es2022 --outfile=sg-family-find-staging-worker.mjs
          node --check sg-family-find-staging-worker.mjs
          test -s sg-family-find-staging-worker.mjs
      - name: Upload staging-only Worker bundle for manual review
        uses: actions/upload-artifact@v4
        with:
          name: sg-family-find-staging-worker
          path: sg-family-find-staging-worker.mjs
          if-no-files-found: error
          retention-days: 7
