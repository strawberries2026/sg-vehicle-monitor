name: Build Android PWA PNG icons
on:
  push:
    branches:
      - feature/android-pwa-png-icons
    paths:
      - .github/workflows/build-pwa-icons.yml
      - icon.svg
      - manifest.webmanifest
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Render SVG into Android PNG sizes
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url='icon.svg',write_to=f'icon-{size}.png',output_width=size,output_height=size)
          PY
          file icon-192.png icon-512.png
      - name: Commit generated icons to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icon-192.png icon-512.png
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Generate Android PWA PNG icons from existing SVG"
          git push origin HEAD:feature/android-pwa-png-icons
