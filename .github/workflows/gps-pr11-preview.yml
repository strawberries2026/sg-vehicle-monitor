name: GPS PR11 isolated preview package
on:
  workflow_dispatch:
  push:
    branches: [feature/gps-follow-reliability]
    paths: ['.github/workflows/gps-pr11-preview.yml']
permissions:
  contents: read
jobs:
  gps-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check app.js
      - name: Check GPS control and privacy invariants
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const source=readFileSync('app.js','utf8');
          for(const term of [
            'navigator.geolocation.getCurrentPosition(update,fail',
            'navigator.geolocation.watchPosition(update,fail',
            'navigator.geolocation.clearWatch(watchId)',
            "followMap=true",
            "if(followMap)map.setView",
            "followButton.setAttribute('aria-pressed'",
            "sec>120",
            "line.setLatLngs(segments)",
            "accuracy>100",
            "segments.push([])",
            "Location recovered",
            "Date.now()-at>120000",
            "Last known position retained"
          ])assert.ok(source.includes(term),'Missing GPS invariant: '+term);
          assert.ok(!source.includes('fetch('+'location'), 'Review location upload changes');
          console.log('GPS static invariants passed (not a browser runtime test)');
          NODE
      - name: Package isolated Android preview (no deployment)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p gps-pr11-preview
          find . -maxdepth 1 -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' -o -name '*.webmanifest' -o -name '*.png' -o -name '*.svg' -o -name '*.ico' \) -exec cp '{}' gps-pr11-preview/ \;
          for file in index.html app.js dashboard-ux.js location-sharing.js; do test -s "gps-pr11-preview/$file"; done
          node --check gps-pr11-preview/dashboard-ux.js
          mkdir -p gps-pr11-preview/data
          test -s data/hospitals.json
          cp data/*.json gps-pr11-preview/data/
          # Replace backend modules only in the generated preview, never in source.
          for file in firebase-init.js location-sharing.js; do
            cat > "gps-pr11-preview/$file" <<'JS'
          window.sgVehicleFirebase = {connected:false, sharingEnabled:false};
          for (const id of ['google-login','google-logout','session-check']) {
            const button=document.getElementById(id); if(button) button.disabled=true;
          }
          for (const id of ['auth-status','sharing-status','session-health']) {
            const node=document.getElementById(id); if(node) node.textContent='Disabled in isolated GPS preview.';
          }
          JS
          done
          rm -f gps-pr11-preview/firebase.json
          for file in hospitals incidents speed-bands; do test -s "gps-pr11-preview/data/$file.json"; done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='gps-pr11-preview/index.html';
          const sha=process.env.GITHUB_SHA.slice(0,12);
          const html=readFileSync(path,'utf8');
          if(!html.includes('</body>')) throw Error('Missing body');
          writeFileSync(path,html.replace('</body>','<div style="position:fixed;top:0;right:0;z-index:9999;background:#172554;color:white;font-size:11px;padding:3px 6px">GPS preview '+sha+'</div></body>'));
          NODE
          cat > gps-pr11-preview/_headers <<'HEADERS'
          /*
            Content-Security-Policy: connect-src 'self' https://api.data.gov.sg https://*.tile.openstreetmap.org; form-action 'none'; object-src 'none'
          HEADERS
          test -s gps-pr11-preview/data/hospitals.json
          ! grep -E 'firebaseapp.com|initializeApp|signInWithPopup' gps-pr11-preview/firebase-init.js gps-pr11-preview/location-sharing.js
          printf '%s\n' 'GPS PR11 TEST PACKAGE — not deployed.' 'Use a separate HTTPS staging origin for GPS.' 'Do not test Family Find or enter credentials in this preview.' 'Production remains unchanged.' > gps-pr11-preview/PREVIEW-INSTRUCTIONS.txt
      - name: Upload Android preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: gps-pr11-android-preview
          path: gps-pr11-preview/
          retention-days: 7
          if-no-files-found: error
